<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 140" width="100%" height="100%">
  <defs>
    <!-- Градиент для фона иконки (Плата) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Градиент для дорожек (Свечение) -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Градиент для микрочипа -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    
    <!-- Градиент для текста SMD -->
    <linearGradient id="smdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Градиент для основного текста -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Фильтр свечения для иконки -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Фильтр для яркого свечения текста SMD -->
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ИКОНКА (Скругленный квадрат - Печатная плата) -->
  <rect x="20" y="20" width="100" height="100" rx="30" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Внутренний блик для объема (Glassmorphism) -->
  <rect x="22" y="22" width="96" height="96" rx="28" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- ДОРОЖКИ ПЕЧАТНОЙ ПЛАТЫ (Теперь идут строго к контактам) -->
  <g filter="url(#glow)">
    <!-- 1. Верхняя дорожка (к верхнему контакту №2) -->
    <path d="M 45 20 L 45 28 L 63 38" fill="none" stroke="url(#traceGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="45" cy="20" r="3" fill="#00F2FE" />
    <circle cx="45" cy="28" r="2" fill="#0F172A" stroke="#00F2FE" stroke-width="1.5" />
    
    <!-- 2. Левая дорожка (к левому контакту №2) -->
    <path d="M 20 73 L 28 73 L 38 63" fill="none" stroke="url(#traceGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="20" cy="73" r="3" fill="#00F2FE" />
    <circle cx="28" cy="73" r="2" fill="#0F172A" stroke="#00F2FE" stroke-width="1.5" />
    
    <!-- 3. Правая дорожка (к правому контакту №3) -->
    <path d="M 120 55 L 112 55 L 102 73" fill="none" stroke="url(#traceGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="120" cy="55" r="3" fill="#00F2FE" />
    <circle cx="112" cy="55" r="2" fill="#0F172A" stroke="#00F2FE" stroke-width="1.5" />
    
    <!-- 4. Нижняя дорожка (к нижнему контакту №2) -->
    <path d="M 85 120 L 85 112 L 63 102" fill="none" stroke="url(#traceGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="85" cy="120" r="3" fill="#00F2FE" />
    <circle cx="85" cy="112" r="2" fill="#0F172A" stroke="#00F2FE" stroke-width="1.5" />
  </g>

  <!-- SMD МИКРОЧИП (Центральный элемент) -->
  <rect x="45" y="45" width="50" height="50" rx="6" fill="url(#chipGrad)" stroke="#38BDF8" stroke-width="2" />
  
  <!-- SMD Выводы (Пины) -->
  <g fill="#FBBF24">
    <!-- Верхние -->
    <rect x="50" y="38" width="6" height="7" rx="1" />
    <rect x="60" y="38" width="6" height="7" rx="1" />
    <rect x="70" y="38" width="6" height="7" rx="1" />
    <rect x="80" y="38" width="6" height="7" rx="1" />
    <!-- Нижние -->
    <rect x="50" y="95" width="6" height="7" rx="1" />
    <rect x="60" y="95" width="6" height="7" rx="1" />
    <rect x="70" y="95" width="6" height="7" rx="1" />
    <rect x="80" y="95" width="6" height="7" rx="1" />
    <!-- Левые -->
    <rect x="38" y="50" width="7" height="6" rx="1" />
    <rect x="38" y="60" width="7" height="6" rx="1" />
    <rect x="38" y="70" width="7" height="6" rx="1" />
    <rect x="38" y="80" width="7" height="6" rx="1" />
    <!-- Правые -->
    <rect x="95" y="50" width="7" height="6" rx="1" />
    <rect x="95" y="60" width="7" height="6" rx="1" />
    <rect x="95" y="70" width="7" height="6" rx="1" />
    <rect x="95" y="80" width="7" height="6" rx="1" />
  </g>

  <!-- ВНУТРЕННИЙ ЭЛЕМЕНТ: ТЕКСТ "SMD" -->
  <g filter="url(#textGlow)">
    <text x="70" y="76" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="20" fill="url(#smdGrad)" text-anchor="middle" letter-spacing="-0.5">
      SMD
    </text>
    <line x1="52" y1="81" x2="88" y2="81" stroke="#00F2FE" stroke-width="2" opacity="0.9" />
    <circle cx="52" cy="81" r="1.5" fill="#00F2FE" />
    <circle cx="88" cy="81" r="1.5" fill="#00F2FE" />
  </g>

  <!-- ТЕКСТ (Название компании) -->
  <text x="150" y="75" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="40" fill="url(#textGrad)" letter-spacing="-0.5">
    Станкопром
  </text>
  
  <!-- ПОДПИСЬ (Слоган) -->
  <text x="152" y="100" font-family="'Inter', 'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#3B82F6" letter-spacing="3">
    SMD-ОБОРУДОВАНИЕ
  </text>
</svg>
