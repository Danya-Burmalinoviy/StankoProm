    <script type="module">
        try {
            const THREE = await import('three');
            const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
            const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');

            let viewer = null;

            window.__vr3dInit = function initViewer3d() {
                const container = document.getElementById('viewer3d');
                if (!container) return;

                if (viewer) { viewer.resize(); return; }

                const w = container.clientWidth;
                const h = container.clientHeight;
                if (w < 50 || h < 50) { setTimeout(window.__vr3dInit, 80); return; }

                container.innerHTML = '';

                const scene = new THREE.Scene();

                const camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 500);
                camera.position.set(9, 7, 12);

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(w, h);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                renderer.outputColorSpace = THREE.SRGBColorSpace;
                container.appendChild(renderer.domElement);

                const controls = new OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.07;
                controls.autoRotate = true;
                controls.autoRotateSpeed = 1.1;
                controls.zoomSpeed = 0.4;        // плавнее (по умолчанию было 1.0)
                controls.zoomToCursor = true;    // зум к курсору — интуитивнее
                controls.minDistance = 5;        // не подъезжать вплотную
                controls.maxDistance = 35;       // общий диапазон
                controls.maxPolarAngle = Math.PI / 1.9;
                controls.target.set(0, 0.5, 0);

                scene.add(new THREE.AmbientLight(0xffffff, 0.7));

                const dir1 = new THREE.DirectionalLight(0xffffff, 1.6);
                dir1.position.set(8, 14, 10);
                dir1.castShadow = true;
                dir1.shadow.mapSize.set(2048, 2048);
                dir1.shadow.camera.left = -15;
                dir1.shadow.camera.right = 15;
                dir1.shadow.camera.top = 15;
                dir1.shadow.camera.bottom = -15;
                scene.add(dir1);

                const dir2 = new THREE.DirectionalLight(0x00F2FE, 0.7);
                dir2.position.set(-8, 6, -8);
                scene.add(dir2);

                const dir3 = new THREE.DirectionalLight(0x4FACFE, 0.5);
                dir3.position.set(-6, 3, 10);
                scene.add(dir3);

                const groundGeo = new THREE.PlaneGeometry(60, 60);
                const groundMat = new THREE.ShadowMaterial({ opacity: 0.15 });
                const ground = new THREE.Mesh(groundGeo, groundMat);
                ground.rotation.x = -Math.PI / 2;
                ground.position.y = -0.01;
                ground.receiveShadow = true;
                scene.add(ground);

                const machine = new THREE.Group();
                scene.add(machine);

                const progressEl = document.createElement('div');
                progressEl.style.cssText = `
                    position: absolute; bottom: 60px; left: 50%;
                    transform: translateX(-50%);
                    background: rgba(0,0,0,0.7); color: #fff;
                    padding: 8px 18px; border-radius: 20px;
                    font-size: 0.8rem; font-weight: 600; z-index: 6;
                    backdrop-filter: blur(8px);
                    font-family: 'Segoe UI', sans-serif;
                    pointer-events: none;
                `;
                progressEl.textContent = 'Загрузка модели… 0%';
                container.appendChild(progressEl);

                const loader = new GLTFLoader();
                loader.load(
                    'models/smd-machine.glb',
                    (gltf) => {
                        const model = gltf.scene;

                        model.traverse((obj) => {
                            if (obj.isMesh) {
                                obj.castShadow = true;
                                obj.receiveShadow = true;
                                if (obj.material && obj.material.isMeshStandardMaterial) {
                                    obj.material.envMapIntensity = 1.0;
                                }
                            }
                        });

                        model.rotation.x = Math.PI;
                        model.updateMatrixWorld(true);

                        const box = new THREE.Box3().setFromObject(model);
                        const size = box.getSize(new THREE.Vector3());
                        const center = box.getCenter(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z);
                        const targetSize = 8;
                        const scale = targetSize / maxDim;
                        model.scale.setScalar(scale);
                        model.position.sub(center.multiplyScalar(scale));
                        model.position.y += (size.y * scale) / 2 - 0.01;

                        machine.add(model);

                        const newBox = new THREE.Box3().setFromObject(model);
                        const newSize = newBox.getSize(new THREE.Vector3());
                        const dist = Math.max(newSize.x, newSize.y, newSize.z) * 1.8;
                        camera.position.set(dist * 0.6, dist * 0.5, dist * 0.8);
                        controls.target.set(0, newSize.y / 2, 0);
                        controls.update();

                        progressEl.remove();

                        if (gltf.animations && gltf.animations.length) {
                            const mixer = new THREE.AnimationMixer(model);
                            gltf.animations.forEach((clip) => {
                                mixer.clipAction(clip).play();
                            });
                            viewer = viewer || {};
                            viewer.mixer = mixer;
                        }
                    },
                    (xhr) => {
                        if (xhr.total) {
                            const pct = Math.round((xhr.loaded / xhr.total) * 100);
                            progressEl.textContent = `Загрузка модели… ${pct}%`;
                        } else {
                            progressEl.textContent = 'Загрузка модели…';
                        }
                    },
                    (error) => {
                        console.error('Ошибка загрузки .glb:', error);
                        progressEl.textContent = '⚠ Не удалось загрузить модель';
                        progressEl.style.background = 'rgba(220, 38, 38, 0.85)';
                        setTimeout(() => progressEl.remove(), 3500);
                    }
                );

                const btnRotate = document.getElementById('vr3dRotate');
                const btnReset  = document.getElementById('vr3dReset');

                if (btnRotate) {
                    btnRotate.addEventListener('click', () => {
                        controls.autoRotate = !controls.autoRotate;
                        btnRotate.classList.toggle('active', controls.autoRotate);
                    });
                }
                if (btnReset) {
                    btnReset.addEventListener('click', () => {
                        const box = new THREE.Box3().setFromObject(machine);
                        const size = box.getSize(new THREE.Vector3());
                        const dist = Math.max(size.x, size.y, size.z) * 1.8;
                        camera.position.set(dist * 0.6, dist * 0.5, dist * 0.8);
                        controls.target.set(0, size.y / 2, 0);
                        controls.update();
                    });
                }

                function resize() {
                    const w2 = container.clientWidth;
                    const h2 = container.clientHeight;
                    if (w2 < 10 || h2 < 10) return;
                    camera.aspect = w2 / h2;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w2, h2);
                }
                window.addEventListener('resize', resize);

                function animate() {
                    requestAnimationFrame(animate);

                    if (viewer && viewer.mixer) {
                        viewer.mixer.update(0.016);
                    }

                    controls.update();
                    renderer.render(scene, camera);
                }
                animate();

                viewer = viewer || {};
                viewer.resize = resize;
            };

            if (document.querySelector('.tab-panel.active[data-panel="models"]')) {
                window.__vr3dInit();
            }
        } catch (err) {
            console.warn('Three.js не загрузился, используется SVG-заглушка:', err);
        }
    </script>
